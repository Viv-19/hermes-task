services:
  - type: web
    name: hermes-email-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    # Deploys are started by the GitHub Action (.github/workflows/ci-cd.yml) once the tests pass,
    # through a deploy hook. Turning Render's own auto-deploy off avoids deploying untested code twice.
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENROUTER_API_KEY
        sync: false # set this in the Render dashboard, never in git
      - key: MOCK_LLM
        value: "0"
