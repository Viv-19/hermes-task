<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hermes Email Assistant</title>
  <meta name="description" content="Email triage and reply drafting for Hermes Travel & Cargo.">
  <link rel="icon" type="image/png" href="/assets/hermes-logo.png">
  <script>
    // Set the theme before first paint so there is no light/dark flash.
    (function () {
      var theme = 'light';
      try {
        theme = localStorage.getItem('hermes.theme') ||
          (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <img class="logo" src="/assets/hermes-logo.png" alt="Hermes Travel &amp; Cargo Pvt Ltd" width="44" height="44">
        <div class="brand-text"><strong>Hermes</strong><span>Email Assistant</span></div>
      </div>
      <nav id="nav" class="nav" aria-label="Sections"></nav>
      <div class="sidebar-foot"><button id="resetBtn" class="link-btn" type="button">Reset data</button></div>
    </aside>

    <div class="main">
      <header class="topbar">
        <h1 id="pageTitle">Dashboard</h1>
        <div class="topbar-actions">
          <span id="apiStatus" class="status-pill" data-state="" hidden><i></i><span></span></span>
          <button id="themeToggle" class="icon-btn" type="button" aria-label="Switch to dark mode" title="Day / night">
            <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
          <button id="sendBtn" class="btn btn-primary send-btn" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            <span id="sendLabel">Send email</span>
          </button>
        </div>
      </header>

      <div id="errorBanner" class="banner" role="alert" hidden></div>
      <main id="view" class="view"></main>
    </div>
  </div>

  <!-- Send email: form, then the live workflow -->
  <div id="composerModal" class="overlay" hidden>
    <div class="overlay-backdrop" data-close="composer"></div>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="composerTitle">
      <button class="icon-btn modal-close" type="button" data-close="composer" aria-label="Close">×</button>
      <h2 id="composerTitle">Analyse an email</h2>

      <div id="composeForm">
        <div class="samples" aria-label="Sample emails">
          <span class="samples-label">Samples</span>
          <div id="sampleChips" class="chip-row"></div>
          <select id="edgeSelect" class="select" aria-label="More sample emails"><option value="">More…</option></select>
        </div>

        <label class="field-label" for="subject">Email subject</label>
        <input id="subject" class="input" type="text" maxlength="300" placeholder="Subject" autocomplete="off">

        <label class="field-label" for="body">Email body</label>
        <textarea id="body" class="textarea" rows="8" placeholder="Paste the email here"></textarea>

        <div class="composer-actions">
          <button id="analyzeBtn" class="btn btn-primary" type="button">Analyse email</button>
          <button id="clearBtn" class="btn btn-ghost" type="button">Clear</button>
          <span id="charCount" class="muted small" aria-live="off">0 / 8000</span>
          <span id="formError" class="form-error" role="alert" hidden></span>
        </div>
        <div class="modal-foot">
          <label class="check"><input id="freshChk" type="checkbox"> Skip cache</label>
          <span id="quotaLine" class="muted small"></span>
        </div>
      </div>

      <div id="runView" class="run-view" aria-live="polite" hidden></div>
    </div>
  </div>

  <!-- Review drawer -->
  <div id="drawer" class="overlay overlay-right" hidden>
    <div class="overlay-backdrop" data-close="drawer"></div>
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
      <div id="drawerHead" class="drawer-head"></div>
      <div id="drawerBody" class="drawer-body"></div>
      <div id="drawerFoot" class="drawer-foot"></div>
    </aside>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
